name: Reproducible synthetic bug
description: A concrete failure with an expected result and verification plan.
title: "[bug][lab] "
body:
  - type: markdown
    attributes:
      value: "Provide synthetic inputs and bounded evidence. Never include credentials, conversations or personal data."
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction and environment
      description: Minimal synthetic steps/input, commit and relevant local environment.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and observed behavior
      description: Describe both outcomes; include a concise evidence pointer or output.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, impact and exclusions
      description: Affected behavior, severity and boundaries of the requested fix.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance and verification
      description: Regression case plus related checks; distinguish pre-merge gates and any legitimate post-merge acceptance.
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Accountable human owner
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, risk and recovery
      description: Related work and sequence; effects of fixing or reverting; use None with a reason where appropriate.
    validations:
      required: true
  - type: textarea
    id: approval
    attributes:
      label: Approval evidence if required
      description: Identify approved scope/version and decision before changing a controlled contract or boundary.
